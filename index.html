<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>גדולי תורה בשאלות השעה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<style>
:root{--bg:#f6f3ec;--ink:#1d2433;--muted:#5d6477;--gold:#9a6b1c;--line:#ddd5c4}
@media (prefers-color-scheme:dark){:root{--bg:#121623;--ink:#ece8de;--muted:#a3a9b8;--gold:#e0b25e;--line:#2a3042}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Frank Ruhl Libre","David","Times New Roman",serif;display:grid;place-items:center;padding:24px 16px;text-align:center}
main{max-width:640px;display:grid;gap:18px}
h1{font-weight:700;font-size:clamp(2rem,7vw,3.2rem);line-height:1.15;margin:0}
.en{direction:ltr;font-size:1.15rem;color:var(--muted);margin:0}
hr{border:0;border-top:1px solid var(--line);width:120px;margin:6px auto}
p{margin:0;font-size:1.2rem}
p.en{font-size:1rem}
.mark{color:var(--gold);font-size:1.6rem}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">✦</div>
  <h1>גדולי תורה בשאלות השעה</h1>
  <p class="en" lang="en">Torah Leaders on the Questions of the Hour</p>
  <hr>
  <p>האתר בהכנה.</p>
  <p class="en" lang="en">This site is in preparation.</p>
</main>
</body>
</html>
